name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just check-layers
      # Warnings are expected: the manifest declares both background.service_worker
      # (Chrome) and background.scripts (Firefox), and web-ext flags the one it ignores.
      - run: npx --yes web-ext lint --source-dir src --warnings-as-errors=false
