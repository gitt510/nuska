<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shukuchi — Settings</title>
    <link rel="stylesheet" href="../design/tokens.css" />
    <link rel="stylesheet" href="../design/theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="page">
      <section class="section">
        <h2 class="h2">Prefix</h2>
        <p class="muted">Click a binding and press keys. Backspace unbinds.</p>
        <div class="bindings" id="bindings"></div>
      </section>

      <section class="section">
        <h2 class="h2">Shortcuts</h2>
        <div class="scroller">
          <table class="table shortcuts">
            <colgroup>
              <col class="key" />
              <col class="title" />
              <col />
              <col class="act" />
            </colgroup>
            <thead>
              <tr>
                <th>Key</th>
                <th>Title</th>
                <th>URL</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="bar">
          <button id="add" class="button primary small" type="button">Add shortcut</button>
          <span id="status" class="muted"></span>
        </div>
      </section>

      <section class="section">
        <h2 class="h2">Import</h2>
        <p class="muted">JSON, or a ShortcutKey2URL export.</p>
        <div class="stack">
          <textarea
            id="import-text"
            class="textarea inlineCode"
            rows="6"
            spellcheck="false"
            placeholder='[{"key": "ex", "title": "Example", "url": "https://example.com"}]'
          ></textarea>
          <button id="import-run" class="button primary small" type="button">Import</button>
        </div>
      </section>
    </main>

    <script src="settings.js"></script>
  </body>
</html>
